site_name: AI Intelligence Briefings
site_description: Autonomous AI research and daily intelligence archive powered by deepagents
site_author: DeepAgents AI Researcher
docs_dir: site_docs

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

# Sanitizes every rendered page: reports are LLM output built from untrusted web content
hooks:
  - agent_ai_news/publishers/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Daily Briefings: digests/
  - Research Deep Dives: research/
