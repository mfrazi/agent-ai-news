name: Weekly AI Intelligence Briefing & Site Publish

on:
  schedule:
    # Every Sunday at 08:00 UTC+7; GitHub cron runs in UTC, so 01:00 UTC on Sunday
    - cron: "0 1 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of lookback days (7 = the weekly digest)"
        required: false
        type: number
        default: 7
      topic:
        description: "Focus topic"
        required: false
        type: string
        default: "Frontier LLMs, Reasoning Models, Open Weights, Multimodal"
      model:
        description: "Model ID override (blank = AGENT_MODEL_NAME variable, then provider default)"
        required: false
        type: string
        default: ""

# Push the new report commit; the deploy-site job gets its own Pages permissions
permissions:
  contents: write

jobs:
  digest-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs; a moved tag cannot swap in code that holds the write token
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          # the default key file is requirements.txt, which this project does not have
          cache-dependency-path: pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate AI Digest & Update Site Index
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Empty auto-detects the provider from whichever API key secret is set
          AGENT_LLM_PROVIDER: ${{ secrets.AGENT_LLM_PROVIDER || '' }}
          # Manual-run input, then the repository variable; empty uses the provider's default model
          AGENT_MODEL_NAME: ${{ inputs.model || vars.AGENT_MODEL_NAME || '' }}
          # Inputs go through env vars, never ${{ }} inside the script, so they cannot inject shell code
          # Scheduled runs have no inputs, so they fall back to the weekly window
          DIGEST_DAYS: ${{ inputs.days || 7 }}
          DIGEST_TOPIC: ${{ inputs.topic || 'Frontier LLMs, Reasoning Models, Open Weights, Multimodal' }}
        run: |
          python -m agent_ai_news.cli digest --days "$DIGEST_DAYS" --topic "$DIGEST_TOPIC"

      - name: Commit New Reports to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI Researcher"
          git add site_docs/
          if git diff --staged --quiet; then
            echo "No new reports generated to commit."
          else
            git commit -m "chore(briefing): automated AI briefing and archive update [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

  # Commits pushed with GITHUB_TOKEN do not trigger other workflows, so call the deployment directly
  deploy-site:
    needs: digest-and-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
