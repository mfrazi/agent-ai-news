name: Daily AI Intelligence Briefing & Site Publish

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of lookback days"
        required: false
        default: "1"
      topic:
        description: "Focus topic"
        required: false
        default: "Frontier LLMs, Reasoning Models, Open Weights, Multimodal"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  digest-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[web]

      - name: Generate AI Digest & Update Site Index
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENT_LLM_PROVIDER: ${{ secrets.AGENT_LLM_PROVIDER || 'openrouter' }}
        run: |
          python -m agent.cli digest --days ${{ github.event.inputs.days || '1' }} --topic "${{ github.event.inputs.topic || 'Frontier LLMs, Reasoning, Open Weights' }}" --publish

      - name: Commit New Reports to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI Researcher"
          git add reports/ site_docs/
          if git diff --staged --quiet; then
            echo "No new reports generated to commit."
          else
            git commit -m "chore(briefing): automated AI briefing and archive update [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Build MkDocs Static Website
        run: |
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
