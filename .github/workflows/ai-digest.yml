name: Daily AI Intelligence Briefing & Site Publish

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of lookback days"
        required: false
        type: number
        default: 1
      topic:
        description: "Focus topic"
        required: false
        type: string
        default: "Frontier LLMs, Reasoning Models, Open Weights, Multimodal"

# Push the new report commit and the gh-pages branch; nothing else
permissions:
  contents: write

jobs:
  digest-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs; a moved tag cannot swap in code that holds the write token
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[web]

      - name: Generate AI Digest & Update Site Index
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENT_LLM_PROVIDER: ${{ secrets.AGENT_LLM_PROVIDER || 'openrouter' }}
          # Inputs go through env vars, never ${{ }} inside the script, so they cannot inject shell code
          DIGEST_DAYS: ${{ inputs.days || 1 }}
          DIGEST_TOPIC: ${{ inputs.topic || 'Frontier LLMs, Reasoning Models, Open Weights, Multimodal' }}
        run: |
          python -m agent_ai_news.cli digest --days "$DIGEST_DAYS" --topic "$DIGEST_TOPIC"

      - name: Commit New Reports to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI Researcher"
          git add site_docs/
          if git diff --staged --quiet; then
            echo "No new reports generated to commit."
          else
            git commit -m "chore(briefing): automated AI briefing and archive update [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build MkDocs Static Website
        run: |
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
