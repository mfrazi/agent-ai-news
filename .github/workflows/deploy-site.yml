name: Deploy Site to GitHub Pages

# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [main]
    paths:
      - "site_docs/**"
      - "mkdocs.yml"
      - "agent_ai_news/publishers/mkdocs_hooks.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  # Called by ai-digest.yml right after it commits a new report
  workflow_call:

# The build only reads the repo; deploy-pages authenticates to Pages with an OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; a moved tag cannot swap in different code
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Branch tip rather than the triggering commit, so a run called right after
          # the digest commit includes the new report
          ref: ${{ github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install .[web]

      - name: Build MkDocs Static Website
        run: mkdocs build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
