[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ai-news"
version = "0.1.0"
description = "Autonomous AI information research and digest agent using LangChain deepagents"
authors = [{ name = "AI Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-anthropic>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "feedparser>=6.0.10",
    "tavily-python>=0.7.0",
    "ddgs>=9.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.3",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "nh3>=0.2.15",
]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-ai-news = "agent_ai_news.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ai_news*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

